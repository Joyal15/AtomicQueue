<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AtomicQueue — appointment booking with atomic holds, live availability, and no double-bookings."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AtomicQueue</title>
    <!--
      Pre-paint theme init. External (not inline) so it runs under a
      strict `script-src 'self'` CSP with no 'unsafe-inline'/hash/nonce.
      Parser-blocking + ahead of the stylesheet, so it still applies the
      theme class before first paint (no light->dark flash).
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
